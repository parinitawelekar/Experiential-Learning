<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Registration</title>
</head>
<body bgcolor="#E6F2FF">
<center>
<table border="1" width="900" cellpadding="8" cellspacing="0" bgcolor="white">
<tr>
<td colspan="2" align="center" bgcolor="#003366">
<font color="white">
<h1>WORKSHOP REGISTRATION</h1>
<h3>Final Step to Join the Event</h3>
</font>
<img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1000&q=80" width="880" height="250" alt="Workshop Banner">
</td>
</tr>
<tr>
<td width="65%" valign="top">
<form action="/submit_registration" method="POST">
<fieldset>
<legend><b>1. Participant Details</b></legend>
<p><b>Full Name:</b><br><input type="text" name="user_name" size="45" required></p>
<p><b>Email Address:</b><br><input type="email" name="user_email" size="45" required></p>
<p><b>Phone Number:</b><br><input type="text" name="phone" size="45"></p>
<p><b>City:</b><br><input type="text" name="city" size="45"></p>
</fieldset>
<br>
<fieldset>
<legend><b>2. Select Workshop Track</b></legend>
<input type="radio" name="track"> Web Development<br>
<input type="radio" name="track"> Data Science<br>
<input type="radio" name="track"> Artificial Intelligence<br>
<input type="radio" name="track"> Cyber Security
</fieldset>
<br>
<legend><b>3. Payment Method</b></legend>
<p><b>Credit Card</b></p>
<p>Card Number:<br><input type="text" size="35"></p>
<p>Expiry: <input type="text" size="10"> CVV: <input type="password" size="5"></p>
<hr>
<p><b>Net Banking</b></p>
<select>
</body>
</html>
